<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security Insights</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="navbar-logo">CyberCheck AI</div>
            <ul class="navbar-menu">
            </ul>
            <div class="navbar-controls">
                <button id="theme-toggle" class="theme-toggle" title="Toggle Dark/Light Mode">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="main-title">
                <div class="brand">Welcome to</div>
                <h1 class="cyber-title">CyberCheck AI</h1>
                <p class="subtitle">Cybersecurity training, awareness, and resources — all in one place.</p>
            </div>
            <div class="search-container">
                <div class="ai-search-bar">
                    <input type="text" id="ai-search" placeholder="Ask me any cybersecurity question!">
                    <button id="search-btn" class="ai-search-btn"><span>✨</span></button>
                </div>
                <div class="esc-hint-container">
                    <div id="esc-progress" class="esc-progress">
                        <svg class="progress-circle" viewBox="0 0 100 100">
                            <circle class="progress-circle-bg" cx="50" cy="50" r="45"></circle>
                            <circle class="progress-circle-fill" cx="50" cy="50" r="45"></circle>
                        </svg>
                    </div>
                    <div id="esc-hint" class="esc-hint">Hold "ESC" to go back to main screen</div>
                </div>
                <div id="ai-response" class="ai-response"></div>
            </div>
            <div id="question-suggestions" class="question-suggestions">
                <div class="suggestion-text"></div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p>&copy; 2025 CyberSecure. Stay safe online.</p>
    </footer>
    <script src="javascript.js"></script>
</body>
</html>
